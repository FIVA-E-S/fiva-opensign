name: Verify AWS deployment access
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.FIVA_ACTIONS_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated runner tools and Docker credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          for tool in aws docker jq curl; do command -v "$tool"; done
          docker_config=$(mktemp -d "${RUNNER_TEMP}/fiva-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          chmod 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '325836185229'
          role-session-name: gh-${{ github.run_id }}
          role-duration-seconds: 14400
          unset-current-credentials: true
      - name: Connect to the production EKS cluster
        run: bash scripts/aws/setup-context.sh
      - name: Verify ECR images and EKS permissions without changing production
        run: bash scripts/aws/verify.sh
      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify image publication without deploying it
        run: bash scripts/aws/verify-publication.sh
      - name: Clean isolated runner credentials
        if: always()
        run: bash scripts/aws/cleanup.sh
