name: Build and deploy OpenSign to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify AWS access without a rollout, or build and deploy main
        type: choice
        default: verify
        options: [verify, deploy]
permissions:
  contents: read
  id-token: write

concurrency:
  group: opensign-aws-production
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_CLUSTER_NAME: ${{ vars.AWS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-source
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: aws-source
          persist-credentials: false
      - name: Prepare isolated runner tools and Docker credentials
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/aws/bootstrap-tools.sh
          docker_config=$(mktemp -d "${RUNNER_TEMP}/fiva-docker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
          chmod 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '325836185229'
          role-session-name: gh-${{ github.run_id }}
          role-duration-seconds: 14400
          unset-current-credentials: true
      - name: Log in to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify image publication without deploying it
        if: inputs.operation == 'verify'
        run: bash scripts/aws/verify-publication.sh
      - name: Build and publish server
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        id: server
        run: bash scripts/aws/build-image.sh fiva/fiva-opensign-server apps/OpenSignServer/Dockerhubfile . "$GITHUB_SHA"
      - name: Build and publish client
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        id: client
        run: bash scripts/aws/build-image.sh fiva/fiva-opensign-client apps/OpenSign/Dockerhubfile . "$GITHUB_SHA"
      - name: Deploy both images preserving storage and webhook secrets
        if: github.event_name == 'push' || inputs.operation == 'deploy'
        env:
          SERVER_IMAGE: ${{ steps.server.outputs.image }}
          CLIENT_IMAGE: ${{ steps.client.outputs.image }}
        run: bash scripts/aws/run-codebuild.sh deploy
      - name: Verify private EKS access from the isolated AWS task
        if: inputs.operation == 'verify'
        run: bash scripts/aws/run-codebuild.sh verify
      - name: Clean isolated runner credentials
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f aws-source/scripts/aws/cleanup.sh ]; then
            bash aws-source/scripts/aws/cleanup.sh
          fi
